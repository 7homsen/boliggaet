services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: boliggaet
      POSTGRES_PASSWORD: boliggaet
      POSTGRES_DB: boliggaet
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boliggaet -d boliggaet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
